<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EM 資料整理 MVP</title><style>
*{box-sizing:border-box}body{font:15px "Microsoft JhengHei",Segoe UI,sans-serif;margin:0;background:#f5f7fa;color:#203044}
header{background:#173f63;color:white;padding:20px 4%}header strong{font-size:23px}nav{display:flex;gap:12px;margin-top:15px}nav a{color:white;padding:7px 15px;border:1px solid #b8d2e6;border-radius:5px;text-decoration:none}
main{max-width:1450px;margin:auto;padding:25px}main.matrix-page{max-width:none;padding:25px 24px}h1{font-size:25px}h2{font-size:19px;margin-top:28px}.panel{background:white;padding:22px;border:1px solid #d3dde6;border-radius:8px;margin-bottom:20px}
.muted{color:#506577;line-height:1.7}.notice{padding:13px;background:#e5f3f6;border-left:4px solid #167a8c;margin:10px 0}a{color:#176580}button,.button{display:inline-block;background:#167a8c;color:white;border:0;border-radius:5px;padding:10px 16px;text-decoration:none;cursor:pointer;font:inherit}.secondary{background:#536b7e}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:block;margin:8px 0}input,select,textarea{padding:8px;border:1px solid #9bafbf;border-radius:4px;font:inherit;max-width:100%}input[type=text],textarea{width:100%}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #d3dde6;padding:9px;text-align:left;vertical-align:top}th{background:#edf3f8;white-space:nowrap}td.number{text-align:right}.original{white-space:pre-wrap;word-break:break-word;max-width:300px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.tag{font-size:13px;background:#e9eff4;padding:3px 7px;border-radius:4px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:15px}.charts svg{width:100%;font-size:11px}details{margin:10px 0}summary{cursor:pointer}footer{font-size:13px;color:#536b7e;margin-top:25px}
@media(max-width:900px){.charts{grid-template-columns:1fr}main{padding:12px}header{padding:16px}}
.matrix-table{min-width:1560px;font-size:13px}.matrix-table th,.matrix-table td{padding:7px;min-width:72px}.matrix-table th:first-child{min-width:125px}.matrix-group th{background:#dceaf2;text-align:left}.matrix-room th{background:#edf3f8;text-align:left}.matrix-cell{text-align:center}.matrix-value{font-weight:700;font-size:15px}.matrix-tags{display:block;font-size:11px;color:#506577}.matrix-alarm{background:#fff2c6}.matrix-action{background:#ffdede}.matrix-review{background:#e9eff4}.conflict-tag{background:#dce3e9;color:#203044}progress{height:18px}
  .matrix-top-scroll{height:20px;overflow-x:auto;overflow-y:hidden;position:sticky;top:0;z-index:2;background:white;box-shadow:0 1px 2px #c6d2dd}.matrix-top-scroll[hidden]{display:none}.matrix-top-scroll-inner{height:1px}
  main.matrix-page .process-controls{max-width:1450px}
@media print{nav,.controls,.no-print,.matrix-top-scroll{display:none!important}body{background:white}main{max-width:none;padding:0}.panel{border:0;padding:8px}table{font-size:10px}th,td{padding:5px}.scroll{overflow:visible}}
</style></head><body><header><strong>EM 資料整理</strong><div>輸入 → 資料庫 → 輸出 · MVP 試用版</div>
{% if not snapshot %}<nav aria-label="主要操作"><a href="{{url_for('index')}}">1　輸入</a><a href="{{url_for('database')}}">2　資料庫</a><a href="{{url_for('reports')}}">3　輸出</a><a href="{{url_for('sheet_reconcile_page')}}">Sheet 核對</a></nav>{% endif %}</header>
<main class="{% block main_class %}{% endblock %}">{% for message in get_flashed_messages() %}<div class="notice" role="status">{{message}}</div>{% endfor %}{% block body %}{% endblock %}
<footer>來源檔保留；本工具產生衍生分析資料與草稿報告。矩陣以每月最早採樣日同筆來源限值提示正常、警戒或行動；資料衝突及未知限值顯示待核對。本工具不作正式簽署。</footer></main></body></html>
